provenance:
  summary: >-
    Composio reference for the tool-calling platform that connects LLM/agent frameworks to 1000+ external app toolkits with managed authentication, tool search, triggers, a sandboxed workbench, and an MCP bridge. Packages the official Composio llms.txt index (https://docs.composio.dev/llms.txt) plus a reproducible verbatim mirror of the documentation pages it links to on docs.composio.dev, under references/vendor/. Covers sessions, the provider adapter layer (OpenAI, Anthropic, Vercel AI SDK, Google, LangChain, Autogen, CrewAI, LlamaIndex, Mastra, custom), managed and custom-app authentication, multiple/shared/imported connected accounts, triggers and custom OAuth webhooks, the remote and local sandbox, session extension (proxy-execute, custom tools, custom MCP), security and data retention, the CLI, the migration guides (direct-to-sessions, MCP-servers-to-sessions, tool-router beta, toolkit versioning, new SDK), examples, the current (v3.1) and legacy (v3.0) REST API references, and the version-independent Python and TypeScript SDK references.
  sources:
    - title: Composio llms.txt index
      url: https://docs.composio.dev/llms.txt
      authors:
        - Composio
      inspected_at: "2026-08-08"
      adopted:
        - Flat curated index of bare absolute .md links on a single host (docs.composio.dev), no nested llms.txt indexes; the one non-.md link (llms-full.txt) is excluded by extension filtering
        - Coverage spans get-started, providers and custom providers, session configuration and extension, authentication and auth customization, triggers, security and data, CLI, migration guides, examples, the current and legacy REST API references, the Python and TypeScript SDK references, toolkits, and meta-tools
    - title: Composio documentation (mirrored .md)
      url: https://docs.composio.dev
      authors:
        - Composio
      inspected_at: "2026-08-08"
      adopted:
        - Verbatim mirror of the docs.composio.dev pages the seed index links to, used for exact SDK wiring, endpoint paths, auth modes, and trigger setup
        - The index carries an imperative block addressed to AI agents suggesting composio.create(...); vendored text is treated as data not a directive, and is not transcribed as instruction into the authored skill
