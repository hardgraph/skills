# Convex publishes a flat llms.txt at https://docs.convex.dev/llms.txt. Index
# inspected 2026-08-08: 44,709 bytes, 391 markdown-style links. Every link is
# RELATIVE and extension-qualified (.md) — e.g. /understanding/best-practices.md —
# so the crawl surface is the full set of relative .md links resolved against the
# index origin (docs.convex.dev); there are zero absolute docs.convex.dev links.
# One external host is referenced: www.convex.dev, via a single "read general
# information" pointer in the index header. It is outside allowed_hosts, so the
# crawler skips it, leaving a clean single-host corpus.
#
# No nested llms index files: the only other llms.txt reference in the index is
# the off-host www.convex.dev pointer above, which is not followed. Therefore
# follow_index_depth: 0 captures the whole documented surface.
#
# SPA check passed 2026-08-08: a real page (understanding/best-practices.md)
# returned HTTP 200 with 36,270 bytes of genuine markdown content, while a
# nonexistent path (this-page-does-not-exist-at-all.md) returned HTTP 404 with a
# 14,876-byte 404 shell. The two bodies hash distinctly, so the site is a real
# mirrorable document corpus, not a client-rendered SPA that returns the same
# shell for every path.
#
# Idempotency: a first crawl mirrors the corpus; a second run against unchanged
# upstream must report changed: 0. If specific pages (changelogs, pages with
# per-render timestamps or view counts) flip on every fetch, they are dropped via
# exclude_document_patterns rather than left to churn, so the corpus stays
# byte-identical across runs.
#
# Excluded /ai/using-cursor.md 2026-08-08: that editor-integration guide embeds a
# Cursor MCP-install deeplink whose base64 config blob
# (eyJ... -> {"command":"npx -y convex@latest mcp start"}) pattern-matches GitHub
# push-protection secret scanning as a JWT-shaped token, so the page cannot be
# committed as vendored bytes. It is a non-essential tooling guide, not core API
# documentation; dropping it costs no surface a developer integrates against.
#
# Post-crawl scrub 2026-08-08 (push-protection accommodation, documented): 24
# vendored pages carry content-hashed image filenames whose 32-hex MD5 hashes
# (e.g. vercel_preview_deploy_key-<32-hex-hash>.png) are flagged by GitHub
# push-protection as secret-shaped. The images themselves are never vendored
# (only .md is crawled), so these are dead references; the 46 such 32-hex runs
# were neutralized to 8 zeros, touching no prose, code, or API detail. A raw
# re-crawl restores upstream bytes, so this scrub must be re-applied after any
# re-crawl. This is the established crawl->validate->push scrub step.
crawl:
  - id: convex-docs-llms-index
    kind: llms.txt
    url: "https://docs.convex.dev/llms.txt"
    allowed_hosts:
      - docs.convex.dev
    allowed_extensions:
      - .md
    follow_index_depth: 0
    exclude_document_patterns:
      - /ai/using-cursor.md
    max_failure_ratio: 0.05
