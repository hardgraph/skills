# Cloudflare's root llms.txt is a directory of 105 product indexes, each of which
# lists that product's pages as absolute `.md` links — so depth 1, not 0.
#
# `include_index_patterns` scopes the crawl to the Developer platform section.
# The other ~66 products (Magic Transit, BYOIP, DMARC, Registrar, WARP, radar…)
# are real Cloudflare documentation but not what someone building on Workers is
# asking about, and including them would roughly triple the corpus.
#
# Note each product index links back to the root directory. The crawler tracks
# visited indexes, so that back-link does not loop.
crawl:
  - id: cloudflare-developers-llms-index
    kind: llms.txt
    url: 'https://developers.cloudflare.com/llms.txt'
    allowed_hosts:
      - developers.cloudflare.com
    allowed_extensions:
      - .md
    follow_index_depth: 1
    include_index_patterns:
      - /workers/llms.txt
      - /workers-ai/llms.txt
      - /workers-vpc/llms.txt
      - /workflows/llms.txt
      - /pages/llms.txt
      - /d1/llms.txt
      - /r2/llms.txt
      - /r2-sql/llms.txt
      - /r2-data-catalog/llms.txt
      - /kv/llms.txt
      - /durable-objects/llms.txt
      - /queues/llms.txt
      - /vectorize/llms.txt
      - /hyperdrive/llms.txt
      - /ai/llms.txt
      - /ai-gateway/llms.txt
      - /ai-search/llms.txt
      - /agents/llms.txt
      - /agent-memory/llms.txt
      - /containers/llms.txt
      - /pipelines/llms.txt
      - /sandbox/llms.txt
      - /browser-run/llms.txt
      - /realtime/llms.txt
      - /images/llms.txt
      - /stream/llms.txt
      - /secrets-store/llms.txt
      - /dynamic-workers/llms.txt
      - /cloudflare-for-platforms/llms.txt
    max_failure_ratio: 0.05
