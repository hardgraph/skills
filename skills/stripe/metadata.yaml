provenance:
  summary: Stripe payments platform reference. Packages the official Stripe llms.txt
    index (https://docs.stripe.com/llms.txt) plus a reproducible verbatim mirror of
    the documentation corpus it links to, under references/vendor/. Covers Checkout,
    Payment Intents, Connect, Billing, Tax, Elements, webhooks, API versioning, and
    the agent guidance that prefers current APIs over the deprecated Charges/Sources/Tokens/Card-Element
    surfaces.
  sources:
  - title: Stripe llms.txt index
    url: https://docs.stripe.com/llms.txt
    authors:
    - Stripe
    inspected_at: '2026-08-08'
    adopted:
    - Curated link index organizing Stripe docs by product area (Checkout, Payments,
      Billing, Elements, Connect, Tax, Identity, Issuing, Treasury)
    - Agent instructions to resolve the latest SDK version, prefer Checkout, avoid
      Charges/Sources/Tokens, use Payment Element over Card Element, use Accounts
      v2 for Connect, and enable dynamic payment methods
    - Decision-tree depth pattern (overview to quickstart to API reference to object
      schema) with legacy content marked
  - title: Stripe documentation corpus (mirrored .md)
    url: https://docs.stripe.com/
    authors:
    - Stripe
    inspected_at: '2026-08-08'
    adopted:
    - Verbatim mirror of every resolvable .md link in the seed index, preserving URL
      path structure under references/vendor/
    - Sandbox and test-card guidance, API reference, webhook delivery and verification,
      Connect, Checkout/Payments/Billing quickstarts, security guidance, and version
      upgrade notes
  - title: Stripe logo kit (official brand assets)
    url: https://stripe.com/newsroom/brand-assets
    authors:
    - Stripe
    license: Stripe trademark. Distributed by Stripe for identification use under
      the Stripe Marks Usage Terms; not placed in the public domain and not relicensed
      here.
    inspected_at: '2026-08-08'
    adopted:
    - Official SVG wordmark in Blurple, used as assets/logo-light.svg for light backgrounds
    - Official SVG wordmark in White, used as assets/logo-dark.svg for dark backgrounds
    notes: Downloaded from Stripe_logo_kit.zip linked on the official brand-assets
      page. The marks are used unmodified to identify Stripe as the subject of this
      node. Do not recolour, distort, or use them to imply endorsement.
