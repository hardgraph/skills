provenance:
  summary: >-
    Cloudflare developer platform reference. Covers Workers and the runtime model, storage bindings (D1, R2, KV, Durable Objects, Queues, Hyperdrive), the AI surface (Workers AI, Vectorize, AI Gateway, Agents), and deployment with Wrangler. Packages a reproducible mirror of the Developer platform documentation under references/vendor/.
  sources:
    - title: Cloudflare Developer Documentation llms.txt directory
      url: 'https://developers.cloudflare.com/llms.txt'
      authors:
        - Cloudflare
      inspected_at: '2026-08-08'
      adopted:
        - 'Two-level structure: a root directory of 105 product indexes, each listing that product pages as absolute .md links'
        - Section grouping used to scope this crawl to the Developer platform rather than the whole product catalogue
        - Documented alternative retrieval via an Accept text/markdown header on any page URL
  notes: >-
    Root directory inspected 2026-08-08: 105 nested product indexes, no direct page links at the root, absolute URLs throughout. Scoped to the Developer platform section. Status is `draft` until the corpus is crawled and the authored guidance reviewed against it.
