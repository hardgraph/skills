# Knip finds and fixes unused dependencies, exports, and files in JS/TS projects.
# Its canonical documentation lives in the repository at packages/docs (an
# Astro/Starlight site, source MDX/MD), also published to knip.dev. There is no
# public llms.txt and the site does not serve .md, so this is a repos crawl.
# Reproducibility note: the knip repository publishes releases without a stable
# version git tag for the docs/knip package (only @knip/vscode-knip and 0.0.0-*
# prerelease tags exist). The crawl is therefore pinned to the default branch
# `main`, where the documentation source is continuously updated. This is a
# documented deviation from the "pin a tag" guidance.
crawl:
  - id: knip-repo
    kind: repos
    url: 'https://github.com/webpro-nl/knip'
    ref: 'main'
    include:
      - 'packages/knip/README.md'
      - 'packages/docs/src/content/docs/**/*.md'
      - 'packages/docs/src/content/docs/**/*.mdx'
    exclude:
      - '**/node_modules/**'
      - 'packages/docs/src/content/docs/blog/**'
      - '**/package.json'
    max_failure_ratio: 0.05
