  summary: >-
    Retell reference. Packages the official docs.retellai.com llms.txt index (https://docs.retellai.com/llms.txt) plus a reproducible verbatim mirror of the documentation it links to under references/vendor/. Retell AI is a platform for building, deploying, and observing realtime conversational voice agents — phone and web — combining speech-to-text, an LLM reasoning loop, text-to-speech, interruption/barge-in handling, telephony (Twilio, Vonage, SIP) and WebRTC transport, function-calling tools, and the Retell Studio / API control plane. Covers agent configuration, the realtime WebSocket protocol, telephony and WebRTC integration, custom LLM and tool/function handlers, call analysis, and web-call embedding.
