provenance:
  summary: >-
    Reference for Knip, a tool that finds and fixes unused dependencies, exports, and files in JavaScript and TypeScript projects. Covers the entry/plugin graph model, knip.json configuration, production mode, monorepos and workspaces, running in CI, reporters, auto-fix, namespace imports, and troubleshooting. Packages a reproducible mirror of the knip repository's documentation corpus under references/vendor/.
  sources:
    - title: knip repository and documentation
