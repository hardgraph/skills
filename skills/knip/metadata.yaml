    - title: Knip website
      url: 'https://knip.dev'
      inspected_at: '2026-08-08'
      adopted:
        - Confirms the documentation source in packages/docs is published verbatim to knip.dev
  notes: >-
    No public llms.txt is published and knip.dev does not serve .md, so the repository documentation source is the mirrorable source of truth. Pinned to the default branch `main`: the knip repository publishes no stable version git tag for the docs/knip package (only @knip/vscode-knip and 0.0.0-* prerelease tags exist), so a branch pin is the only reproducible option and the documentation source is kept current on main. Status is `draft` until the corpus is crawled and the authored guidance reviewed against it.
