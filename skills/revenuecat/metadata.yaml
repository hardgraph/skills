provenance:
  summary: >-
    RevenueCat reference. Packages the official docs.revenuecat.com llms.txt index (https://docs.revenuecat.com/llms.txt) plus a reproducible verbatim mirror of the documentation it links to under references/vendor/ (documents are served as text/markdown at www.revenuecat.com). RevenueCat is a subscription and in-app-purchase platform that wraps Apple App Store / StoreKit, Google Play Billing, Amazon, and Stripe behind one cross-platform SDK and a server API, normalising products, offerings, entitlements, purchases, restore, and subscription lifecycle (grace period, billing retry, refunds) across iOS, Android, web, Flutter, React Native, and Unity. Covers the Purchases SDK, product/entitlement configuration, customer info and entitlement checks, paywalls and offerings, server-side webhooks and the REST API, sandbox and StoreKit testing, and identity (anonymous vs identified app user IDs).
