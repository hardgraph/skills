provenance:
  summary: >-
    PayPal payments platform reference. Covers the Orders v2 payment flow, the
    browser JS SDK and Smart Payment Buttons, subscriptions, payouts, disputes,
    webhook verification, sandbox testing, and the Business versus Platforms
    split. Steers away from the legacy NVP/SOAP and Express Checkout surfaces
    that remain functional and therefore keep resurfacing in tutorials.
  sources:
    - title: PayPal Developer llms.txt index
      url: 'https://developer.paypal.com/llms.txt'
      authors:
        - PayPal
      inspected_at: '2026-08-08'
      adopted:
        - 'Two-level index structure: a root index linking nine section indexes, which in turn list pages as relative extensionless paths'
        - Section split between Business and Platforms, which mirrors the two integration audiences and their divergent APIs
        - Page counts per section, used to scope the crawl away from the oversized Other section
    - title: PayPal Developer documentation
      url: 'https://developer.paypal.com/'
      authors:
        - PayPal
      inspected_at: '2026-08-08'
      adopted:
        - Orders v2 create/approve/capture lifecycle as the current payment flow, superseding Payments v1 and Express Checkout
        - OAuth 2.0 client-credentials token exchange, with separate sandbox and live credentials and base URLs
        - Webhook signature verification against the raw request body, and at-least-once delivery requiring idempotent handlers
  notes: >-
    Written from PayPal's public developer documentation, inspected 2026-08-08.
    Markdown is served by appending `.md` to a documentation path
    (`/alipay.md` returns text/markdown); `/alipay/index.md` does not resolve.
    Status is `draft` until the corpus has been crawled and the guidance reviewed
    against it — in particular the exact webhook verification endpoint and the
    current API version pins, which are deliberately left as links rather than
    asserted values.
