# Authored crawl inputs. The crawler reports back into `vendor:`.
#
# PayPal's llms.txt is an index of indexes: the root lists nine section indexes,
# each of which lists pages as relative, extensionless paths. Appending `.md` to
# a page path returns markdown, so `follow_index_depth` and `append_extension`
# describe the dialect rather than hard-coding PayPal anywhere in the crawler.
#
# The `Other` section is excluded deliberately: it holds ~2,969 pages of
# miscellany against ~900 in the product sections, and mirroring it would triple
# the corpus for material an agent integrating PayPal will not read.
crawl:
  - id: paypal-developer-llms-index
    kind: llms.txt
    url: 'https://developer.paypal.com/llms.txt'
    allowed_hosts:
      - developer.paypal.com
    allowed_extensions:
      - .md
    max_failure_ratio: 0.05
