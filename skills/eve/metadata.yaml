# Vercel eve is a filesystem-first framework for durable backend AI agents.
# Its canonical documentation lives in the repository docs/ directory (MDX + MD),
# which also ships inside the installed package at node_modules/eve/docs. There is
# no public llms.txt, so this is a repos crawl. Pinned to release tag eve@0.31.3
# for reproducibility. Include globs select the docs/ content plus the root
# README; excludes drop source, e2e fixtures, research notes, and nested SKILL.md.
crawl:
  - id: eve-repo
    kind: repos
    url: 'https://github.com/vercel/eve'
    ref: 'eve@0.31.3'
    include:
      - README.md
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
    exclude:
      - '**/node_modules/**'
      - 'e2e/**'
      - 'packages/**'
      - 'research/**'
      - 'skills/**'
      - '**/SKILL.md'
    max_failure_ratio: 0.05
