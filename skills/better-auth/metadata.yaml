# Better Auth's index is flat but every link is a root-relative path that itself
# begins with `/llms.txt/` — for example `/llms.txt/docs/adapters/drizzle.md`,
# which resolves to https://www.better-auth.com/llms.txt/docs/adapters/drizzle.md
# and serves text/markdown. The bare docs path (without the /llms.txt prefix)
# returns 404, so relative resolution against the index URL is required rather
# than optional here.
#
# Classified by shape: flat, so depth 0. A naive substring check would misread
# these as nested indexes because the path contains `llms.txt`; index detection
# keys on the path *ending* in llms.txt, which these do not.
crawl:
  - id: better-auth-docs-llms-index
    kind: llms.txt
    url: 'https://www.better-auth.com/llms.txt'
    allowed_hosts:
      - www.better-auth.com
    allowed_extensions:
      - .md
    follow_index_depth: 0
    max_failure_ratio: 0.05
