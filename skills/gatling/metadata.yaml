provenance:
  summary: >-
    Gatling reference. Packages the official docs.gatling.io llms.txt index (https://docs.gatling.io/llms.txt) plus a reproducible verbatim mirror of the documentation it links to under references/vendor/. Gatling is a load- and performance-testing tool that runs protocol-level (HTTP, JMS, MQTT) load tests as code, with Java, Kotlin, Scala, and JavaScript DSLs, a Maven/Gradle/sbt build integration, feeders and session variables, closed and open workload models (concurrent users vs requests per second), checks and assertions, HTML reports, and the hosted Gatling Enterprise control plane. Covers simulation structure, scenarios and execs, injection profiles, feeders, checks, the recorder, CLI and CI runners, and reporting.
