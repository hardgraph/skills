provenance:
  summary: >-
    WireMock reference. Packages the official wiremock.org llms.txt index (https://wiremock.org/llms.txt) plus a reproducible verbatim mirror of the documentation it links to on wiremock.org, under references/vendor/. The seed llms.txt is a small pointer index to two nested documentation indexes; at follow_index_depth 1 the complete WireMock documentation is delivered as the single concatenated llms-full.txt markdown file, so the vendored file count is intentionally small while the content is the full docs. Covers stubbing and request matching, response templating (Handlebars), record/playback and proxying, simulating faults and delays, stateful scenarios, the standalone JAR and Docker images, the JUnit 5 extension, the Spring Boot test starter, WireMock .NET, WireMock Cloud, and the extension/response-transformer APIs.
